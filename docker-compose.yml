# docker compose up --build
# docker cp bulk_uploader_app:/app/output/output.html ./output.html
services:
  app:
    build: .
    container_name: bulk_uploader_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@db:5432/ques}
      OUTPUT_HTML_PATH: /app/output/output.html
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${PWD}/output:/app/output
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ques
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ques"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
